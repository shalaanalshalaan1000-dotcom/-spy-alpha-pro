services:
  - type: web
    name: spy-alpha-pro-v4
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MASSIVE_API_KEY
        sync: false
      - key: MIN_CONFIDENCE
        value: "70"
      - key: OPTIONS_MAX_DTE
        value: "14"
      - key: OPTIONS_STRIKE_WINDOW_PCT
        value: "0.10"
      - key: RISK_FREE_RATE
        value: "0.04"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
