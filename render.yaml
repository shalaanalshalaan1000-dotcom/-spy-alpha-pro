services:
  - type: web
    name: spy-alpha-pro-v4
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    envVars:
      - key: MASSIVE_API_KEY
        sync: false
      - key: MIN_CONFIDENCE
        value: "82"
      - key: GOLD_MAX_DAILY_SIGNALS
        value: "10"
      - key: GOLD_REQUIRE_NEWS_FEED
        value: "false"
      - key: GOLD_NEWS_BLOCK_ENTRIES
        value: "false"
      - key: GOLD_NEWS_CACHE_MS
        value: "300000"
      - key: OPTIONS_MAX_DTE
        value: "14"
      - key: OPTIONS_STRIKE_WINDOW_PCT
        value: "0.10"
      - key: RISK_FREE_RATE
        value: "0.04"
      - key: AUTH_ENABLED
        value: "false"
      - key: ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_BASE_URL
        value: "https://spy-alpha-pro-1.onrender.com"
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_API_PASSWORD
        sync: false
      - key: CAPITAL_DEMO
        value: "false"
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_MIN_CONFIDENCE
        value: "82"
      - key: GOLD_TELEGRAM_MIN_CONFIDENCE
        value: "82"
      - key: GOLD_TELEGRAM_MIN_RR
        value: "0.90"
      - key: TELEGRAM_CONFIRM_ON_5M_CLOSE
        value: "false"
      - key: GOLD_MIN_LIVE_TP1_R
        value: "0.90"
      - key: GOLD_SL_COOLDOWN_MS
        value: "300000"
      - key: GOLD_SAME_SIDE_REENTRY_MS
        value: "300000"
      - key: GOLD_M5_ENTRY_WINDOW_MS
        value: "150000"
      - key: XAU_ACCOUNT_BALANCE_USD
        value: "155"
      - key: XAU_SAFE_RISK_USD
        value: "5"
      - key: XAU_MAX_RISK_USD
        value: "10"
      - key: XAU_CONTRACT_SIZE
        value: "100"
      - key: XAU_LOT_STEP
        value: "0.01"
      - key: BTC_ACCOUNT_BALANCE_USD
        value: "155"
      - key: EXNESS_BTC_CONTRACT_SIZE
        value: "1"
      - key: EXNESS_BTC_LOT_STEP
        value: "0.01"
      - key: BTC_SAFE_RISK_USD
        value: "5"
      - key: BTC_MAX_RISK_USD
        value: "10"
      - key: TELEGRAM_EARLY_MIN_CONFIDENCE
        value: "82"
      - key: TELEGRAM_CANDIDATE_MIN_CONFIDENCE
        value: "82"
      - key: TELEGRAM_MIN_RR
        value: "0.90"
      - key: MAX_TELEGRAM_SIGNALS_PER_DAY
        value: "10"
      - key: TELEGRAM_COOLDOWN_MINUTES
        value: "5"
      - key: TELEGRAM_SCAN_INTERVAL_SECONDS
        value: "60"
      - key: TELEGRAM_CANDIDATE_LIMIT
        value: "6"
      - key: TELEGRAM_MARKET_ONLY
        value: "true"
