name: Validate gold and BTC confluence engines

on:
  push:
    paths:
      - 'gold-confluence-model.js'
      - 'gold-site-signal-engine-v9.js'
      - 'gold-site-ui-start.js'
      - 'gold-unified-start.js'
      - 'gold-agent-orchestrator.js'
      - 'test/gold-agent-orchestrator.test.js'
      - 'site-indicator-start.js'
      - 'telegram-xau-bot-v2.js'
      - 'telegram-xau-bot-v2.js'
      - 'telegram-xau-bot-v3.js'
      - 'btc-ict-fast.js'
      - 'btc-murphy-model.js'
      - 'btc-telegram-bot.js'
      - 'render-start.js'
      - '.github/workflows/validate-confluence.yml'
  pull_request:
    paths:
      - 'gold-confluence-model.js'
      - 'gold-site-signal-engine-v9.js'
      - 'gold-site-ui-start.js'
      - 'gold-unified-start.js'
      - 'gold-agent-orchestrator.js'
      - 'gold-laura-agent.js'
      - 'test/gold-agent-orchestrator.test.js'
      - 'test/laura-agents.test.js'
      - 'site-indicator-start.js'
      - 'telegram-xau-bot-v2.js'
      - 'telegram-xau-bot-v3.js'
      - 'btc-ict-fast.js'
      - 'btc-laura-engine.js'
      - 'btc-murphy-model.js'
      - 'btc-telegram-bot.js'
      - 'render-start.js'
      - 'render.yaml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check gold-confluence-model.js
          node --check gold-ict-swing-model.js
          node --check gold-site-signal-engine-v9.js
          node --check gold-site-ui-start.js
          node --check gold-unified-start.js
          node --check gold-agent-orchestrator.js
          node --check site-indicator-start.js
          node --check telegram-xau-bot-v2.js
          node --check telegram-xau-bot-v3.js
          node --check btc-ict-fast.js
          node --check btc-murphy-model.js
          node --check btc-telegram-bot.js
          node --check render-start.js
      - name: Validate XAU agent regression tests
        run: node --test test/gold-agent-orchestrator.test.js
      - name: Run regression tests
        run: npm test
      - name: Validate confluence module imports
        run: |
          node -e "import('./gold-confluence-model.js').then(m=>{if(typeof m.analyzeGoldSignal!=='function')process.exit(1)})"
          node -e "import('./btc-ict-fast.js').then(m=>{if(typeof m.getBtcSignal!=='function')process.exit(1)})"
