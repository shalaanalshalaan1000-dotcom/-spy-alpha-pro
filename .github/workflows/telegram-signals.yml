name: Gold Alpha always-on scanner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-signals.yml
      - gold-site-signal-engine.js
      - gold-site-signal-engine-v3.js
      - gold-site-signal-engine-v9.js
      - gold-ict-swing-model.js
      - gold-site-ui-start.js
      - gold-data-bridge.js
      - gold-signal-model.js
      - gold-unified-start.js
      - site-indicator-start.js
      - telegram-xau-bot.js
      - telegram-xau-bot-v3.js
      - render.yaml
      - package.json
  schedule:
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alpha-always-on-scanner
  cancel-in-progress: true

jobs:
  wake-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate ICT runtime syntax
        run: |
          node --check gold-ict-swing-model.js
          node --check gold-site-signal-engine-v9.js
          node --check gold-site-ui-start.js
          node --check telegram-xau-bot-v3.js
      - name: Install runtime dependency
        run: npm ci --ignore-scripts
      - name: Smoke boot ICT signal engine
        shell: bash
        run: |
          set +e
          timeout 8s node gold-site-signal-engine-v9.js > /tmp/ict-engine.log 2>&1
          code=$?
          cat /tmp/ict-engine.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            exit "$code"
          fi
      - name: Smoke boot gold UI runtime
        shell: bash
        run: |
          set +e
          timeout 8s node gold-site-ui-start.js > /tmp/gold-ui.log 2>&1
          code=$?
          cat /tmp/gold-ui.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            exit "$code"
          fi
      - name: Diagnose live XAUUSD feeds
        run: |
          set +e
          echo '--- Capital status ---'
          curl -sS --connect-timeout 10 --max-time 20 'https://spy-alpha-pro-1.onrender.com/api/capital/status' || true
          echo
          echo '--- Capital gold quote ---'
          curl -sS --connect-timeout 10 --max-time 20 'https://spy-alpha-pro-1.onrender.com/api/capital/gold?force=1' || true
          echo
          echo '--- Data bridge quote ---'
          curl -sS --connect-timeout 10 --max-time 20 'https://spy-alpha-pro-1.onrender.com/api/data/quote?force=1' || true
          echo
          echo '--- Signal health ---'
          curl -sS --connect-timeout 10 --max-time 20 'https://spy-alpha-pro-1.onrender.com/api/health' || true
          echo
      - name: Keep Render awake and advance XAUUSD server-side model
        env:
          SIGNAL_ENDPOINT: https://spy-alpha-pro-1.onrender.com/api/auto-trade/signal?observe=1
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 8 \
            --connect-timeout 20 --max-time 180 \
            "$SIGNAL_ENDPOINT" > /tmp/gold-alpha-signal.json
          python - <<'PY'
          import json
          p='/tmp/gold-alpha-signal.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          print('Gold Alpha wake OK:', {
              'build': d.get('build'),
              'status': d.get('status'),
              'action': d.get('action'),
              'candidateAction': d.get('candidateAction'),
              'sampleCount': d.get('sampleCount'),
              'readingCompleteness': d.get('readingCompleteness'),
              'historySource': d.get('historySource'),
              'provider': d.get('provider'),
              'degraded': d.get('degraded'),
              'noAI': d.get('noAI'),
              'updatedAt': d.get('updatedAt')
          })
          PY
