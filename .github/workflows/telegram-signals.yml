name: Gold Alpha always-on scanner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-signals.yml
      - gold-site-signal-engine.js
      - gold-site-ui-start.js
      - gold-signal-model.js
      - gold-unified-start.js
      - site-indicator-start.js
      - telegram-xau-bot.js
      - package.json
  schedule:
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alpha-always-on-scanner
  cancel-in-progress: true

jobs:
  wake-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep Render awake and advance XAUUSD server-side model
        env:
          SIGNAL_ENDPOINT: https://spy-alpha-pro-1.onrender.com/api/auto-trade/signal?observe=1
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 8 \
            --connect-timeout 20 --max-time 180 \
            "$SIGNAL_ENDPOINT" > /tmp/gold-alpha-signal.json
          python - <<'PY'
          import json
          p='/tmp/gold-alpha-signal.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          print('Gold Alpha wake OK:', {
              'build': d.get('build'),
              'status': d.get('status'),
              'action': d.get('action'),
              'candidateAction': d.get('candidateAction'),
              'sampleCount': d.get('sampleCount'),
              'readingCompleteness': d.get('readingCompleteness'),
              'noAI': d.get('noAI'),
              'updatedAt': d.get('updatedAt')
          })
          PY
