name: Gold 5m expected move patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gold-5m-expected-move.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch XAUUSD model to 5 minutes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          reps=[
            ('أهداف الذهب التقديرية — نموذج 15 دقيقة','توقع الذهب — نموذج 5 دقائق'),
            ('تُعرض الأهداف بعد اكتمال 15 دقيقة من العينات ووصول التأكيد إلى 75%؛ وإلا تبقى القراءة انتظار.','يُعرض السيناريو المتوقع بعد اكتمال 5 دقائق من العينات ووصول التأكيد إلى 75%؛ وإلا تبقى القراءة انتظار.'),
            ('الشارت 15 دقيقة من OANDA عبر TradingView','الشارت 5 دقائق من OANDA عبر TradingView'),
            ("if(n<10||span<15)return{...base,note:'جمع '+fixed(span,1)+' من 15 دقيقة مطلوبة لبناء القناة وتقدير المدة.'};", "if(n<6||span<5)return{...base,note:'جمع '+fixed(span,1)+' من 5 دقائق مطلوبة لبناء التوقع وتقدير الحركة.'};"),
            ('const sigmaPerSqrtMinute=elapsed>0?price*Math.sqrt(logSquares/elapsed):0,expected15=sigmaPerSqrtMinute*Math.sqrt(15),prices=recent.map(x=>x.price),range=Math.max(...prices)-Math.min(...prices),totalMove=slope*span,noise=Math.max(rmse,expected15*.55,price*.00005),snr=Math.abs(totalMove)/noise,aligned=Math.abs(price-predicted)<=Math.max(rmse,price*.00005)||(slope>0?price>predicted:price<predicted);', 'const sigmaPerSqrtMinute=elapsed>0?price*Math.sqrt(logSquares/elapsed):0,expected5=sigmaPerSqrtMinute*Math.sqrt(5),prices=recent.map(x=>x.price),range=Math.max(...prices)-Math.min(...prices),totalMove=slope*span,noise=Math.max(rmse,expected5*.55,price*.00005),snr=Math.abs(totalMove)/noise,aligned=Math.abs(price-predicted)<=Math.max(rmse,price*.00005)||(slope>0?price>predicted:price<predicted);'),
            ('let confidence=Math.round(45+Math.min(23,snr*7)+Math.min(12,span*.8)+Math.min(8,n/4));','let confidence=Math.round(45+Math.min(23,snr*7)+Math.min(12,span*2.4)+Math.min(8,n/3));'),
            ('const move=Math.min(price*.006,Math.max(price*.0004,expected15,rmse*1.5,range*.28)),direction=slope>0?1:-1,target1=price+direction*move,target2=price+direction*move*1.75,channelHalf=Math.max(rmse*1.6,move*.55),invalidation=price-direction*Math.max(move*.75,channelHalf),pace=Math.max(Math.abs(slope),move/30),eta=(distance,min,max)=>{const center=distance/pace,round5=value=>Math.max(5,Math.round(value/5)*5),low=Math.max(min,Math.min(max,round5(center*.7))),high=Math.max(low+5,Math.min(max,round5(center*1.5)));return low+\'–\'+high+\' دقيقة\'};', 'const move=Math.min(price*.004,Math.max(price*.00025,expected5,rmse*1.35,range*.24)),direction=slope>0?1:-1,target1=price+direction*move,target2=price+direction*move*1.6,channelHalf=Math.max(rmse*1.5,move*.55),invalidation=price-direction*Math.max(move*.7,channelHalf),pace=Math.max(Math.abs(slope),move/12),eta=(distance,min,max)=>{const center=distance/pace,round5=value=>Math.max(5,Math.round(value/5)*5),low=Math.max(min,Math.min(max,round5(center*.7))),high=Math.max(low+5,Math.min(max,round5(center*1.5)));return low+\'–\'+high+\' دقيقة\'};'),
            ("return{...base,state:direction>0?'UP':'DOWN',confidence,channel,slopePerMinute:fixed(slope,3),expectedMove15:fixed(move),target1:fixed(target1),target2:fixed(target2),invalidation:fixed(invalidation),eta1:eta(move,5,120),eta2:eta(move*1.75,10,240),note:'المدة نطاق تقديري مشروط باستمرار زخم القناة؛ لمس مستوى الإلغاء يبطل السيناريو.'};", "return{...base,state:direction>0?'UP':'DOWN',confidence,channel,slopePerMinute:fixed(slope,3),expectedMove5:fixed(move),expectedMovePct:fixed(move/price*100,3),target1:fixed(target1),target2:fixed(target2),invalidation:fixed(invalidation),eta1:eta(move,5,45),eta2:eta(move*1.6,5,90),note:'الحركة المتوقعة خلال 5 دقائق تقريبًا '+fixed(move,2)+'$ ('+fixed(move/price*100,3)+'%). السيناريو احتمالي ويُلغى عند مستوى الإلغاء.'};"),
            ("$('#goldConfidence').textContent=plan.state==='COLLECTING'?(plan.sampleCount+' عينة • '+plan.spanMinutes+' / 15 د'):('التأكيد '+plan.confidence+'% • المطلوب 75%');", "$('#goldConfidence').textContent=plan.state==='COLLECTING'?(plan.sampleCount+' عينة • '+plan.spanMinutes+' / 5 د'):('التأكيد '+plan.confidence+'% • الحركة المتوقعة '+(plan.expectedMove5!=null?money(plan.expectedMove5):'—')+' ('+(plan.expectedMovePct!=null?plan.expectedMovePct+'%':'—')+')');")
          ]
          changed=0
          for old,new in reps:
              if old in s:
                  s=s.replace(old,new,1); changed+=1
              elif new in s:
                  pass
              else:
                  print('WARN missing replacement:', old[:120])
          if changed==0:
              raise SystemExit('No gold 5m changes applied')
          p.write_text(s)
          print('Applied',changed,'gold 5m replacements')
          PY
      - name: Validate syntax
        run: node --check server.js
      - name: Commit gold 5m model
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "spy-alpha-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Switch gold forecast to 5m expected move"
          git push origin main
