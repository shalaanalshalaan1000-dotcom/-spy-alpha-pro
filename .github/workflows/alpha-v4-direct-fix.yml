name: Alpha Pro V4 direct stability fix
on:
  push:
    paths:
      - '.github/workflows/alpha-v4-direct-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch server.js directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()

          def replace_once(old,new,label):
              global s
              if new in s:
                  print(label+': already applied')
                  return
              if old not in s:
                  raise SystemExit(label+': anchor missing')
              s=s.replace(old,new,1)
              print(label+': applied')

          # Active-position UI styles
          css_old=".instrumentPolicy{margin:-4px 0 14px;padding:9px 12px;border:1px solid #334155;border-radius:10px;color:#93a4c5;background:#0c1320;font-size:11px;line-height:1.7}.instrumentPolicy.spx{border-color:#71552b;color:#e9cf82;background:#211b10}.spxRow{box-shadow:inset -3px 0 #d6ad52}"
          css_new=css_old+"\n.positionPanel{margin-bottom:14px;border-color:#334a68;background:linear-gradient(145deg,#101b2d,#0e1524 60%)}.positionPanel.conflict{border-color:#8a4b33;box-shadow:inset 0 0 0 1px #8a4b3344}.positionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.positionHead h2{margin:0}.positionStatus{padding:6px 9px;border:1px solid #405071;border-radius:999px;font-size:11px;font-weight:900}.positionList{display:grid;gap:9px}.positionItem{display:grid;grid-template-columns:1.1fr repeat(5,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid #2b3b56;border-radius:11px;background:#0d1421}.positionCell span{display:block;color:#8ea0c0;font-size:10px}.positionCell b{display:block;margin-top:4px;font-size:12px;direction:ltr}.positionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.positionActions button{font-size:11px;padding:8px 10px}.positionWarning{margin-top:10px;padding:9px 10px;border:1px solid #7d5532;border-radius:10px;color:#ffd166;background:#261b10;font-size:12px;line-height:1.6}.positionEmpty{color:#8ea0c0;font-size:12px}.dangerBtn{border-color:#713447;color:#ff91a5}.hedgeBtn{border-color:#765e2c;color:#f0d27a}@media(max-width:900px){.positionItem{grid-template-columns:repeat(2,1fr)}}"
          if '.positionPanel{' not in s: replace_once(css_old,css_new,'position css')

          html_old='<section class="toolbar"><span class="stockLabel">الأساسية + SPX + اختيارات الرادار</span><select id="symbol"></select><button id="refresh">تحليل الآن</button><label><input type="checkbox" id="auto" checked> تحديث تلقائي</label><a class="logout" id="logout" href="/logout" hidden>تسجيل الخروج</a></section><p id="instrumentPolicy" class="instrumentPolicy">SPY / QQQ / IWM / NVDA + القياديات تعمل بالقواعد الأساسية. اختر SPX لمسار 0DTE المستقل.</p>'
          html_new=html_old+'\n<article id="positionPanel" class="positionPanel"><div class="positionHead"><h2>الصفقات النشطة المثبتة</h2><span id="positionStatus" class="positionStatus">لا توجد صفقة نشطة</span></div><div id="positionList" class="positionList"><div class="positionEmpty">بعد ظهور CALL أو PUT اضغط «اعتمد الدخول الحالي». الصفقة تبقى محفوظة مع الوقف والأهداف حتى تغلقها.</div></div><div class="positionActions"><button id="enterTrade" onclick="adoptCurrentTrade()" disabled>اعتمد الدخول الحالي</button><button id="hedgeBtn" class="hedgeBtn" onclick="allowCurrentHedge()" hidden>السماح Hedge لهذا الرمز</button></div><div id="positionWarning" class="positionWarning" hidden></div></article>'
          if 'id="positionPanel"' not in s: replace_once(html_old,html_new,'position html')

          js_old="const GOLD_SAMPLE_KEY='spyAlphaGoldSamplesV2',GOLD_MIN_CONFIDENCE=75;"
          js_new=r'''const GOLD_SAMPLE_KEY='spyAlphaGoldSamplesV2',GOLD_MIN_CONFIDENCE=75;
const ACTIVE_POSITION_KEY='spyAlphaActivePositionsV1';
let activePositions=[],lastAnalysis=null;
function restoreActivePositions(){try{const rows=JSON.parse(localStorage.getItem(ACTIVE_POSITION_KEY)||'[]');return(Array.isArray(rows)?rows:[]).filter(x=>x&&x.id&&x.symbol&&['CALL','PUT'].includes(x.direction))}catch{return[]}}
function saveActivePositions(){try{localStorage.setItem(ACTIVE_POSITION_KEY,JSON.stringify(activePositions))}catch{}}
function posMoney(v){return v==null?'—':'$'+Number(v).toFixed(2)}
function renderActivePositions(){
  const list=$('#positionList'),status=$('#positionStatus'),panel=$('#positionPanel');if(!list||!status||!panel)return;panel.classList.remove('conflict');
  if(!activePositions.length){status.textContent='لا توجد صفقة نشطة';list.innerHTML='<div class="positionEmpty">بعد ظهور CALL أو PUT اضغط «اعتمد الدخول الحالي». الصفقة تبقى محفوظة مع الوقف والأهداف حتى تغلقها.</div>';return}
  status.textContent=activePositions.length+' صفقة نشطة';
  list.innerHTML=activePositions.map(p=>'<div class="positionItem"><div class="positionCell"><span>الرمز / الاتجاه</span><b class="'+p.direction+'">'+p.symbol+' '+p.direction+'</b></div><div class="positionCell"><span>العقد / الانتهاء</span><b>'+p.contract+' • '+p.expiry+'</b></div><div class="positionCell"><span>دخول العقد</span><b>'+posMoney(p.entryPremium)+'</b></div><div class="positionCell"><span>هدف العقد</span><b class="positive">'+posMoney(p.targetPremium)+'</b></div><div class="positionCell"><span>وقف العقد</span><b class="negative">'+posMoney(p.stopPremium)+'</b></div><div class="positionCell"><span>وقف الأصل / الهدف</span><b>'+posMoney(p.stockStop)+' / '+posMoney(p.stockTarget)+'</b></div><button class="dangerBtn" onclick="closeActivePosition(\''+p.id+'\')">إغلاق</button></div>').join('');
}
function currentOppositePosition(d){if(!d||!['CALL','PUT'].includes(d.state))return null;return activePositions.find(p=>p.symbol===d.symbol&&p.direction!==d.state&&!p.hedgeAllowed)||null}
function applyPositionGuard(d){
  lastAnalysis=d;renderActivePositions();const actionable=d&&['CALL','PUT'].includes(d.state)&&d.contract,enter=$('#enterTrade'),hedge=$('#hedgeBtn'),warning=$('#positionWarning'),panel=$('#positionPanel');if(enter)enter.disabled=!actionable;if(!warning||!hedge||!panel)return;
  const opposite=currentOppositePosition(d);if(opposite){panel.classList.add('conflict');warning.hidden=false;hedge.hidden=false;warning.textContent='⚠️ انعكاس '+d.state+' على '+d.symbol+' بينما لديك '+opposite.direction+' نشط ('+opposite.contract+'). أغلق الصفقة الأولى أو اسمح Hedge صراحة.';$('#state').textContent='انعكاس '+d.state+' ⚠️';$('#state').className='WATCH';if(enter)enter.disabled=true}else{warning.hidden=true;hedge.hidden=true}
}
function adoptCurrentTrade(){
  const d=lastAnalysis;if(!d||!['CALL','PUT'].includes(d.state)||!d.contract)return;const opposite=currentOppositePosition(d);if(opposite){applyPositionGuard(d);return}
  const existing=activePositions.find(p=>p.contract===d.contract.symbol),row={id:existing?.id||[d.symbol,d.direction,d.contract.symbol,Date.now()].join('-'),symbol:d.symbol,direction:d.direction,contract:d.contract.symbol,expiry:d.contract.expiry,strike:d.contract.strike,entryPremium:d.contract.mid,targetPremium:d.contract.estimatedAtTarget,stopPremium:d.contract.estimatedAtStop,stockEntry:d.spot,stockTarget:d.setup?.stockTarget,stockStop:d.setup?.invalidation,confidence:d.confidence,enteredAt:existing?.enteredAt||new Date().toISOString(),hedgeAllowed:existing?.hedgeAllowed||false};
  activePositions=activePositions.filter(p=>p.id!==row.id);activePositions.unshift(row);saveActivePositions();renderActivePositions();applyPositionGuard(d)
}
function closeActivePosition(id){activePositions=activePositions.filter(p=>p.id!==id);saveActivePositions();renderActivePositions();if(lastAnalysis)applyPositionGuard(lastAnalysis)}
function allowCurrentHedge(){const d=lastAnalysis;if(!d)return;activePositions=activePositions.map(p=>p.symbol===d.symbol?{...p,hedgeAllowed:true}:p);saveActivePositions();renderActivePositions();applyPositionGuard(d);const warning=$('#positionWarning');if(warning){warning.hidden=false;warning.textContent='Hedge مسموح صراحة لـ '+d.symbol+'. يمكن الآن اعتماد الاتجاه المعاكس.'}const enter=$('#enterTrade');if(enter)enter.disabled=!(d.contract&&['CALL','PUT'].includes(d.state))}
'''
          if 'ACTIVE_POSITION_KEY' not in s: replace_once(js_old,js_new,'position js')

          analyze_old="    if(!r.ok||d.error)throw new Error(d.error||'Request failed');\n    showInstrumentPolicy(s,d.instrumentPolicy);\n    $('#state').textContent=d.state;"
          analyze_new="    if(!r.ok||d.error)throw new Error(d.error||'Request failed');\n    lastAnalysis=d;\n    showInstrumentPolicy(s,d.instrumentPolicy);\n    $('#state').textContent=d.state;"
          if 'lastAnalysis=d;' not in s: replace_once(analyze_old,analyze_new,'analysis state')
          conf_old="    $('#conf').textContent=d.confidence+'%';"
          conf_new=conf_old+"\n    setTimeout(()=>applyPositionGuard(d),0);"
          if 'setTimeout(()=>applyPositionGuard(d),0);' not in s: replace_once(conf_old,conf_new,'guard hook')
          init_old="(async()=>{\n  goldSamples=restoreGoldSamples();"
          init_new="(async()=>{\n  activePositions=restoreActivePositions();\n  renderActivePositions();\n  goldSamples=restoreGoldSamples();"
          if 'activePositions=restoreActivePositions();' not in s: replace_once(init_old,init_new,'position init')

          # Gold server-side sampling
          gold_client_old="    const r=await fetch('https://api.gold-api.com/price/XAU',{cache:'no-store'}),raw=await r.json(),d=goldBrowserReading(raw);\n    if(!r.ok||d.error)throw new Error(d.error||'Gold request failed');"
          gold_client_new="    const r=await fetch('/api/gold-state',{cache:'no-store'}),raw=await r.json();\n    if(Array.isArray(raw.samples)&&raw.samples.length)goldSamples=raw.samples.map(x=>({price:Number(x.price),t:Number(x.t)})).filter(x=>Number.isFinite(x.price)&&Number.isFinite(x.t));\n    const d=goldBrowserReading(raw);\n    if(!r.ok||d.error)throw new Error(d.error||'Gold request failed');"
          if "fetch('/api/gold-state'" not in s: replace_once(gold_client_old,gold_client_new,'gold client')

          server_old="function currentMode(){return process.env.MASSIVE_API_KEY?{mode:'LIVE',provider:'MASSIVE'}:{mode:'DEMO',provider:'DEMO'}}"
          server_new=r'''const goldServerState={samples:[],price:null,updatedAt:null,lastFetchAt:null,lastError:null,running:false};
async function refreshGoldServerState(){
  if(goldServerState.running)return;goldServerState.running=true;
  try{const r=await fetch('https://api.gold-api.com/price/XAU',{headers:{accept:'application/json'},signal:AbortSignal.timeout(10000)}),raw=await r.json(),price=Number(raw.price),updatedAt=new Date(raw.updatedAt||Date.now());if(!r.ok||!Number.isFinite(price)||price<=0||Number.isNaN(updatedAt.getTime()))throw new Error(raw?.error||'Invalid gold response');const t=updatedAt.getTime(),last=goldServerState.samples.at(-1);if(!last||t>last.t)goldServerState.samples.push({price,t});else if(t===last.t)last.price=price;const now=Date.now();goldServerState.samples=goldServerState.samples.filter(x=>x.t>=now-2*60*60_000&&x.t<=now+60_000).slice(-240);goldServerState.price=price;goldServerState.updatedAt=updatedAt.toISOString();goldServerState.lastFetchAt=new Date().toISOString();goldServerState.lastError=null}catch(error){goldServerState.lastError=String(error.message||error).slice(0,240)}finally{goldServerState.running=false}}
void refreshGoldServerState();const goldServerTimer=setInterval(()=>void refreshGoldServerState(),30_000);goldServerTimer.unref();
function currentMode(){return process.env.MASSIVE_API_KEY?{mode:'LIVE',provider:'MASSIVE'}:{mode:'DEMO',provider:'DEMO'}}'''
          if 'const goldServerState=' not in s: replace_once(server_old,server_new,'gold server')

          route_old="    const url=new URL(req.url,'http://localhost');\n    if(req.method==='POST'&&url.pathname==='/api/telegram/run'){"
          route_new="    const url=new URL(req.url,'http://localhost');\n    if(req.method==='GET'&&url.pathname==='/api/gold-state'){if(!goldServerState.price)await refreshGoldServerState();if(!goldServerState.price)return sendJSON(res,503,{error:goldServerState.lastError||'Gold data unavailable'});return sendJSON(res,200,{price:goldServerState.price,updatedAt:goldServerState.updatedAt,samples:goldServerState.samples,lastFetchAt:goldServerState.lastFetchAt,error:goldServerState.lastError});}\n    if(req.method==='POST'&&url.pathname==='/api/telegram/run'){"
          if "url.pathname==='/api/gold-state'" not in s: replace_once(route_old,route_new,'gold route')

          # Confidence: broader range only when confluence is genuinely stronger
          quick_old="confidence=Math.min(88,Math.round(50+gap*.4));"
          quick_new="confidence=Math.min(94,Math.round(48+gap*.55));"
          if quick_old in s: s=s.replace(quick_old,quick_new,1); print('quick confidence: applied')
          core_old="direction=bull>bear?'CALL':bear>bull?'PUT':'NO TRADE',raw=Math.max(bull,bear),confidence=Math.min(95,Math.round(45+raw*.75));"
          core_new="direction=bull>bear?'CALL':bear>bull?'PUT':'NO TRADE',raw=Math.max(bull,bear),edge=Math.abs(bull-bear),confidence=Math.min(97,Math.round(43+raw*.72+Math.min(12,edge*.16)));"
          if core_old in s: s=s.replace(core_old,core_new,1); print('core confidence: applied')
          s=s.replace("confidence=Math.max(0,Math.min(95,confidence));","confidence=Math.max(0,Math.min(97,confidence));",1)

          p.write_text(s)
          PY
          node --check server.js
      - name: Commit direct fix
        run: |
          git config user.name 'chatgpt-alpha-pro'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m 'stabilize active trades gold tracking and confidence'
          git push origin main
