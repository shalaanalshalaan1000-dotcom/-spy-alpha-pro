name: Alpha Pro V4 active position guard
on:
  push:
    paths:
      - '.github/workflows/active-position-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch active-position logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()

          css_anchor='.instrumentPolicy{margin:-4px 0 14px;padding:9px 12px;border:1px solid #334155;border-radius:10px;color:#93a4c5;background:#0c1320;font-size:11px;line-height:1.7}.instrumentPolicy.spx{border-color:#71552b;color:#e9cf82;background:#211b10}.spxRow{box-shadow:inset -3px 0 #d6ad52}'
          css_add=css_anchor+'\n.positionPanel{margin-bottom:14px;border-color:#334a68;background:linear-gradient(145deg,#101b2d,#0e1524 60%)}.positionPanel.conflict{border-color:#8a4b33;box-shadow:inset 0 0 0 1px #8a4b3344}.positionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.positionHead h2{margin:0}.positionStatus{padding:6px 9px;border:1px solid #405071;border-radius:999px;font-size:11px;font-weight:900}.positionList{display:grid;gap:9px}.positionItem{display:grid;grid-template-columns:1.1fr repeat(5,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid #2b3b56;border-radius:11px;background:#0d1421}.positionCell span{display:block;color:#8ea0c0;font-size:10px}.positionCell b{display:block;margin-top:4px;font-size:12px;direction:ltr}.positionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.positionActions button{font-size:11px;padding:8px 10px}.positionWarning{margin-top:10px;padding:9px 10px;border:1px solid #7d5532;border-radius:10px;color:#ffd166;background:#261b10;font-size:12px;line-height:1.6}.positionEmpty{color:#8ea0c0;font-size:12px}.dangerBtn{border-color:#713447;color:#ff91a5}.hedgeBtn{border-color:#765e2c;color:#f0d27a}@media(max-width:900px){.positionItem{grid-template-columns:repeat(2,1fr)}}'
          if '.positionPanel{' not in s:
              assert css_anchor in s, 'CSS anchor not found'
              s=s.replace(css_anchor,css_add,1)

          html_anchor='<section class="toolbar"><span class="stockLabel">الأساسية + SPX + اختيارات الرادار</span><select id="symbol"></select><button id="refresh">تحليل الآن</button><label><input type="checkbox" id="auto" checked> تحديث تلقائي</label><a class="logout" id="logout" href="/logout" hidden>تسجيل الخروج</a></section><p id="instrumentPolicy" class="instrumentPolicy">SPY / QQQ / IWM / NVDA + القياديات تعمل بالقواعد الأساسية. اختر SPX لمسار 0DTE المستقل.</p>'
          position_html=html_anchor+'\n<article id="positionPanel" class="positionPanel"><div class="positionHead"><h2>الصفقات النشطة المثبتة</h2><span id="positionStatus" class="positionStatus">لا توجد صفقة نشطة</span></div><div id="positionList" class="positionList"><div class="positionEmpty">بعد ظهور CALL أو PUT اضغط «اعتمد الدخول الحالي». بعدها لن يسمح Alpha Pro بإشارة معاكسة لنفس الرمز كصفقة عادية.</div></div><div class="positionActions"><button id="enterTrade" onclick="adoptCurrentTrade()" disabled>اعتمد الدخول الحالي</button><button id="hedgeBtn" class="hedgeBtn" onclick="allowCurrentHedge()" hidden>السماح Hedge لهذا الرمز</button></div><div id="positionWarning" class="positionWarning" hidden></div></article>'
          if 'id="positionPanel"' not in s:
              assert html_anchor in s, 'HTML anchor not found'
              s=s.replace(html_anchor,position_html,1)

          js_anchor="const GOLD_SAMPLE_KEY='spyAlphaGoldSamplesV2',GOLD_MIN_CONFIDENCE=75;"
          js_add=r'''const GOLD_SAMPLE_KEY='spyAlphaGoldSamplesV2',GOLD_MIN_CONFIDENCE=75;
const ACTIVE_POSITION_KEY='spyAlphaActivePositionsV1';
let activePositions=[],lastAnalysis=null;
function restoreActivePositions(){
  try{
    const rows=JSON.parse(localStorage.getItem(ACTIVE_POSITION_KEY)||'[]');
    return (Array.isArray(rows)?rows:[]).filter(x=>x&&x.id&&x.symbol&&['CALL','PUT'].includes(x.direction));
  }catch{return[]}
}
function saveActivePositions(){try{localStorage.setItem(ACTIVE_POSITION_KEY,JSON.stringify(activePositions))}catch{}}
function posMoney(v){return v==null?'—':'$'+Number(v).toFixed(2)}
function renderActivePositions(){
  const list=$('#positionList'),status=$('#positionStatus'),panel=$('#positionPanel');
  if(!list||!status||!panel)return;
  panel.classList.remove('conflict');
  if(!activePositions.length){status.textContent='لا توجد صفقة نشطة';list.innerHTML='<div class="positionEmpty">بعد ظهور CALL أو PUT اضغط «اعتمد الدخول الحالي». بعدها لن يسمح Alpha Pro بإشارة معاكسة لنفس الرمز كصفقة عادية.</div>'}
  else{
    status.textContent=activePositions.length+' صفقة نشطة';
    list.innerHTML=activePositions.map(p=>'<div class="positionItem"><div class="positionCell"><span>الرمز / الاتجاه</span><b class="'+p.direction+'">'+p.symbol+' '+p.direction+'</b></div><div class="positionCell"><span>العقد / الانتهاء</span><b>'+p.contract+' • '+p.expiry+'</b></div><div class="positionCell"><span>دخول العقد</span><b>'+posMoney(p.entryPremium)+'</b></div><div class="positionCell"><span>هدف العقد</span><b class="positive">'+posMoney(p.targetPremium)+'</b></div><div class="positionCell"><span>وقف العقد</span><b class="negative">'+posMoney(p.stopPremium)+'</b></div><div class="positionCell"><span>وقف الأصل / الهدف</span><b>'+posMoney(p.stockStop)+' / '+posMoney(p.stockTarget)+'</b></div><button class="dangerBtn" onclick="closeActivePosition(\''+p.id+'\')">إغلاق</button></div>').join('');
  }
}
function currentOppositePosition(d){
  if(!d||!['CALL','PUT'].includes(d.state))return null;
  return activePositions.find(p=>p.symbol===d.symbol&&p.direction!==d.state&&!p.hedgeAllowed)||null;
}
function applyPositionGuard(d){
  lastAnalysis=d;
  renderActivePositions();
  const actionable=d&&['CALL','PUT'].includes(d.state)&&d.contract;
  const enter=$('#enterTrade'),hedge=$('#hedgeBtn'),warning=$('#positionWarning'),panel=$('#positionPanel');
  if(enter)enter.disabled=!actionable;
  if(!warning||!hedge||!panel)return;
  const opposite=currentOppositePosition(d);
  if(opposite){
    panel.classList.add('conflict');
    warning.hidden=false;
    hedge.hidden=false;
    warning.textContent='⚠️ انعكاس '+d.state+' على '+d.symbol+' بينما لديك '+opposite.direction+' نشط ('+opposite.contract+'). الإشارة الجديدة ليست دخولًا مستقلًا: أغلق الصفقة الأولى أو اسمح Hedge صراحة.';
    $('#state').textContent='انعكاس '+d.state+' ⚠️';
    $('#state').className='WATCH';
    if(enter)enter.disabled=true;
  }else{
    warning.hidden=true;
    hedge.hidden=true;
  }
}
function adoptCurrentTrade(){
  const d=lastAnalysis;
  if(!d||!['CALL','PUT'].includes(d.state)||!d.contract)return;
  const opposite=currentOppositePosition(d);
  if(opposite){applyPositionGuard(d);return}
  const existing=activePositions.find(p=>p.contract===d.contract.symbol);
  const row={id:existing?.id||[d.symbol,d.direction,d.contract.symbol,Date.now()].join('-'),symbol:d.symbol,direction:d.direction,contract:d.contract.symbol,expiry:d.contract.expiry,strike:d.contract.strike,entryPremium:d.contract.mid,targetPremium:d.contract.estimatedAtTarget,stopPremium:d.contract.estimatedAtStop,stockEntry:d.spot,stockTarget:d.setup?.stockTarget,stockStop:d.setup?.invalidation,confidence:d.confidence,enteredAt:existing?.enteredAt||new Date().toISOString(),hedgeAllowed:existing?.hedgeAllowed||false};
  activePositions=activePositions.filter(p=>p.id!==row.id);activePositions.unshift(row);saveActivePositions();renderActivePositions();applyPositionGuard(d);
}
function closeActivePosition(id){activePositions=activePositions.filter(p=>p.id!==id);saveActivePositions();renderActivePositions();if(lastAnalysis)applyPositionGuard(lastAnalysis)}
function allowCurrentHedge(){
  const d=lastAnalysis;if(!d)return;
  activePositions=activePositions.map(p=>p.symbol===d.symbol?{...p,hedgeAllowed:true}:p);saveActivePositions();renderActivePositions();applyPositionGuard(d);
  const warning=$('#positionWarning');if(warning){warning.hidden=false;warning.textContent='Hedge مسموح صراحة لـ '+d.symbol+'. يمكن الآن اعتماد الاتجاه المعاكس، وسيُحفظ المركزان منفصلين.'}
  const enter=$('#enterTrade');if(enter)enter.disabled=!(d.contract&&['CALL','PUT'].includes(d.state));
}'''
          if 'ACTIVE_POSITION_KEY' not in s:
              assert js_anchor in s, 'JS anchor not found'
              s=s.replace(js_anchor,js_add,1)

          analyze_anchor="if(!r.ok||d.error)throw new Error(d.error||'Request failed');\n    showInstrumentPolicy(s,d.instrumentPolicy);\n    $('#state').textContent=d.state;"
          analyze_replace="if(!r.ok||d.error)throw new Error(d.error||'Request failed');\n    showInstrumentPolicy(s,d.instrumentPolicy);\n    lastAnalysis=d;\n    $('#state').textContent=d.state;"
          if 'lastAnalysis=d;' not in s:
              assert analyze_anchor in s, 'Analyze anchor not found'
              s=s.replace(analyze_anchor,analyze_replace,1)

          conf_anchor="$('#conf').textContent=d.confidence+'%';"
          conf_replace=conf_anchor+"\n    setTimeout(()=>applyPositionGuard(d),0);"
          if 'setTimeout(()=>applyPositionGuard(d),0);' not in s:
              assert conf_anchor in s, 'Confidence anchor not found'
              s=s.replace(conf_anchor,conf_replace,1)

          init_anchor='(async()=>{\n  goldSamples=restoreGoldSamples();'
          init_replace='(async()=>{\n  activePositions=restoreActivePositions();\n  renderActivePositions();\n  goldSamples=restoreGoldSamples();'
          if 'activePositions=restoreActivePositions();' not in s:
              assert init_anchor in s, 'Init anchor not found'
              s=s.replace(init_anchor,init_replace,1)

          p.write_text(s)
          PY
      - name: Validate syntax
        run: node --check server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Guard active trades against opposite signals"
            git push origin main
          fi
